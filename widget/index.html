<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Book an appointment</title>
<meta name="robots" content="noindex"/>
<style>
  /* Self-contained widget styles — system fonts, no external requests.
     --brand is set at runtime from the tenant's brand_color. */
  :root { --brand:#5d7d55; --brand-ink:#fff; --ink:#242b21; --soft:#5d685a; --line:#e4e7de; --bg:#fff; --tint:#f5f6f1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:transparent; }
  .kb { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:20px; max-width:560px; margin:0 auto; }
  .kb h2 { font-size:1.15rem; margin-bottom:2px; }
  .kb .sub { color:var(--soft); font-size:.85rem; margin-bottom:14px; }
  .kb .steps { display:flex; gap:6px; margin-bottom:16px; }
  .kb .steps span { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .kb .steps span.on { background:var(--brand); }
  .kb h3 { font-size:.95rem; margin:14px 0 8px; }
  .kb .opts { display:grid; gap:8px; }
  .kb .opt { text-align:left; border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; background:var(--bg); cursor:pointer; font:inherit; width:100%; transition:border-color .15s; }
  .kb .opt:hover { border-color:var(--brand); }
  .kb .opt.on { border-color:var(--brand); background:var(--tint); }
  .kb .opt b { display:block; }
  .kb .opt small { color:var(--soft); }
  .kb .days { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px; }
  .kb .day { flex:0 0 auto; min-width:64px; text-align:center; border:1.5px solid var(--line); border-radius:10px; padding:8px 6px; background:var(--bg); cursor:pointer; font:inherit; }
  .kb .day.on { border-color:var(--brand); background:var(--tint); }
  .kb .day small { display:block; color:var(--soft); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; }
  .kb .times { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
  .kb .time { border:1.5px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center; background:var(--bg); cursor:pointer; font:inherit; font-size:.88rem; }
  .kb .time.on { border-color:var(--brand); background:var(--brand); color:var(--brand-ink); }
  .kb label { display:block; font-size:.85rem; font-weight:600; margin:12px 0 4px; }
  .kb input, .kb textarea { width:100%; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; font:inherit; }
  .kb input:focus, .kb textarea:focus { outline:none; border-color:var(--brand); }
  .kb .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kb .nav { display:flex; gap:10px; margin-top:18px; }
  .kb .btn { border:0; border-radius:999px; padding:11px 22px; font:inherit; font-weight:600; cursor:pointer; }
  .kb .btn.primary { background:var(--brand); color:var(--brand-ink); flex:1; }
  .kb .btn.primary:disabled { opacity:.45; cursor:default; }
  .kb .btn.ghost { background:var(--tint); color:var(--ink); }
  .kb .err { color:#b3402a; font-size:.85rem; margin-top:10px; display:none; }
  .kb .err.show { display:block; }
  .kb .done { text-align:center; padding:22px 6px; }
  .kb .done .tick { width:56px; height:56px; margin:0 auto 12px; border-radius:50%; background:var(--tint); display:grid; place-items:center; color:var(--brand); }
  .kb .muted { color:var(--soft); font-size:.85rem; }
  .kb .spin { text-align:center; color:var(--soft); padding:24px 0; }
  .kb .powered { text-align:center; margin-top:14px; font-size:.72rem; color:var(--soft); }
  .kb .powered a { color:inherit; }
  @media (max-width:480px){ .kb .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="kb" id="app"><div class="spin">Loading booking…</div></div>
  <script src="widget.js"></script>
</body>
</html>
